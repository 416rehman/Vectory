name: public site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            help-center/package-lock.json
            dashboard/package-lock.json
      - name: Install Help center dependencies
        run: npm ci
        working-directory: help-center
      - name: Install standalone designer dependencies
        run: npm ci
        working-directory: dashboard
      - name: Build landing page and public documentation
        run: node site/scripts/build.mjs
      - name: Test public content and documentation links
        run: node --test site/tests/site.test.mjs
      - name: Install the test browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: dashboard
      - name: Check the standalone designer in a browser
        run: node site/tests/designer-browser.mjs
      - name: Check source flow paths in Chromium and Firefox
        run: node site/tests/flow-path-browser.mjs
      - name: Verify deployable entry points
        run: |
          test -s site/dist/index.html
          test -s site/dist/help/index.html
          test -s site/dist/designer/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-site
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  release-ready:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with: { cosign-release: "v3.1.3" }
      - name: Authenticate the website's public release and immutable image signatures
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re; print(re.search(r"^const Version = \"([^\"]+)\"$", open("agent/internal/agent/types.go").read(), re.M).group(1))')
          if ! gh api "repos/416rehman/Vectory/releases/tags/v$version" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error"; then
            if grep -q '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "::notice::Site built and tested, but deployment waits for public release v$version."
              exit 0
            fi
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          python3 packaging/verify-site-release.py "$RUNNER_TEMP/release.json" "$version" > "$RUNNER_TEMP/site-release-proof.json"
          python3 - "$RUNNER_TEMP/site-release-proof.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          proof = json.loads(Path(sys.argv[1]).read_text())
          ready = proof['ready']
          with open(sys.argv[2], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              print('::notice::Deployment waits for a public stable release with its verified signing inventory.')
          PY

  deploy:
    if: >-
      github.repository == '416rehman/Vectory' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'release') &&
      github.event_name != 'pull_request' &&
      needs.release-ready.outputs.ready == 'true'
    needs: [build, release-ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Cloudflare deployment skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository secrets.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          name: public-site
          path: site/dist
      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy site/dist --project-name=vectory --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
