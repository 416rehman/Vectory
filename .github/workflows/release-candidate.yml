name: release candidate (no publication)
# An unsigned development candidate, kept only as workflow artifacts: agents
# for every target with their archives and catalog, .deb and .rpm packages
# (installed and removed in containers), an MSI (installed and removed on
# Windows), small source-free preview and server starters, the server and
# validator images, CycloneDX SBOMs for the Rust, Go
# and npm dependencies, the npm advisory audit, a license inventory, and
# SHA256SUMS over everything.
# Nothing is signed, pushed or published; every catalog entry says signed:false.
#   gh workflow run release-candidate.yml --ref <branch>
# packaging/README.md describes the outputs.
on:
  workflow_dispatch:
    inputs:
      attest:
        description: "Create GitHub provenance through the protected release environment (requires configured identity)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
env:
  # Tools are pinned by version and, for Go modules, by the checksum-database hash.
  NFPM_MODULE: github.com/goreleaser/nfpm/v2
  NFPM_VERSION: v2.47.0
  NFPM_SUM: "h1:0bioJAjWaMPntgDqynP4ze0Wt4zYqYSFJ5/BBy9XIGI="
  CYCLONEDX_GOMOD_MODULE: github.com/CycloneDX/cyclonedx-gomod
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  CYCLONEDX_GOMOD_SUM: "h1:OuFUYNhnjpju7RNArOVPPchFPWNobGfhrHODDPKcgZs="
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  WIX_VERSION: "5.0.2"
  DEBIAN_IMAGE: debian:12-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
  ALMALINUX_IMAGE: almalinux:9-minimal@sha256:e03fe7d942a94ad7a72b9fe5eb6af54388b05bc8357151c891f13c023817df98
jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - run: go test ./...
        timeout-minutes: 10
        working-directory: agent
      - name: Reject unsafe or incomplete release archives
        timeout-minutes: 10
        run: python3 packaging/test_verify_release.py
      - name: Unit-test the local preview certificate helper
        timeout-minutes: 10
        run: go test packaging/dev-pki/main.go packaging/dev-pki/main_test.go
      - name: Build the agents, archives and catalog for every target
        timeout-minutes: 10
        run: python3 packaging/build-release.py --out artifacts/releases
      - name: Check Linux ELF has no dynamic interpreter or dependencies
        timeout-minutes: 10
        run: |
          # A negated command never stops `set -e`, so each check fails explicitly.
          for binary in artifacts/releases/vectory-*-linux-*; do
            case "$binary" in *.tar.gz) continue ;; esac
            if readelf -l "$binary" | grep 'INTERP'; then echo "::error::$binary has a dynamic interpreter"; exit 1; fi
            if readelf -d "$binary" | grep 'NEEDED'; then echo "::error::$binary needs shared libraries"; exit 1; fi
          done
      - name: Verify the catalog, archives and checksums
        timeout-minutes: 10
        run: python3 packaging/verify-release.py artifacts/releases --agent-bundle-only
      - name: Build .deb and .rpm packages with the pinned nfpm
        timeout-minutes: 10
        working-directory: packaging
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/tools"
          sum=$(cd "$RUNNER_TEMP" && go mod download -json "$NFPM_MODULE@$NFPM_VERSION" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Sum"])')
          [ "$sum" = "$NFPM_SUM" ] || { echo "::error::nfpm $NFPM_VERSION has hash $sum, expected $NFPM_SUM"; exit 1; }
          go install "$NFPM_MODULE/cmd/nfpm@$NFPM_VERSION"
          version=$(python3 -c 'import re; print(re.search(r"^const Version = \"([^\"]+)\"$", open("../agent/internal/agent/types.go").read(), re.M).group(1))')
          mkdir -p ../artifacts/packages
          for arch in amd64 arm64; do
            for packager in deb rpm; do
              VERSION="$version" GOARCH="$arch" "$GOBIN/nfpm" package --config nfpm.yaml --packager "$packager" --target ../artifacts/packages/
            done
          done
          ls -l ../artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: candidate-agents
          path: |
            artifacts/releases
            artifacts/packages
          if-no-files-found: error
  packages:
    needs: agents
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 10
        with: { name: candidate-agents, path: artifacts }
      - name: Install, run and remove the .deb on Debian 12
        timeout-minutes: 10
        run: |
          docker run --rm --network none -v "$PWD/artifacts/packages:/packages:ro" "$DEBIAN_IMAGE" sh -euxc '
            dpkg -i /packages/vectory_*_amd64.deb
            vectory --version
            vectory version --json
            vectory help setup > /dev/null
            vectory setup --help > /dev/null
            test "$(stat -c %a /usr/bin/vectory)" = 755
            test -f /usr/lib/systemd/system/vectory.service
            # The slim image leaves /usr/share/doc out of an installed system, so the
            # license and notice are checked in the package itself.
            test "$(dpkg-deb -c /packages/vectory_*_amd64.deb | grep -c " ./usr/share/doc/vectory/LICENSE$")" -ge 1
            test "$(dpkg-deb -c /packages/vectory_*_amd64.deb | grep -c " ./usr/share/doc/vectory/NOTICE$")" -ge 1
            test ! -e /var/lib/vectory-agent
            if getent passwd vectory; then echo "installing created an account"; exit 1; fi
            status=0; vectory run --state-dir /tmp/absent || status=$?; test "$status" = 78
            dpkg -r vectory
            test ! -e /usr/bin/vectory
          '
      - name: Install, run and remove the .rpm on AlmaLinux 9
        timeout-minutes: 10
        run: |
          docker run --rm --network none -v "$PWD/artifacts/packages:/packages:ro" "$ALMALINUX_IMAGE" sh -euxc '
            rpm -i /packages/vectory-*.x86_64.rpm
            rpm -q vectory
            vectory --version
            vectory version --json
            vectory help setup > /dev/null
            vectory setup --help > /dev/null
            test "$(stat -c %a /usr/bin/vectory)" = 755
            test -f /usr/lib/systemd/system/vectory.service
            test "$(rpm -qlp /packages/vectory-*.x86_64.rpm | grep -cx /usr/share/doc/vectory/LICENSE)" -ge 1
            test "$(rpm -qlp /packages/vectory-*.x86_64.rpm | grep -cx /usr/share/doc/vectory/NOTICE)" -ge 1
            test ! -e /var/lib/vectory-agent
            if getent passwd vectory; then echo "installing created an account"; exit 1; fi
            status=0; vectory run --state-dir /tmp/absent || status=$?; test "$status" = 78
            rpm -e vectory
            test ! -e /usr/bin/vectory
          '
      - name: Check the arm64 packages' metadata and contents
        timeout-minutes: 10
        run: |
          set -euo pipefail
          deb=$(ls artifacts/packages/vectory_*_arm64.deb)
          dpkg-deb -f "$deb" Package Version Architecture
          [ "$(dpkg-deb -f "$deb" Architecture)" = arm64 ]
          # grep -c reads the whole listing: grep -q would end the pipe early, and
          # pipefail then reports the writer's broken pipe as a failure.
          [ "$(dpkg-deb -c "$deb" | grep -c ' ./usr/bin/vectory$')" -ge 1 ]
          [ "$(dpkg-deb -c "$deb" | grep -c ' ./usr/share/doc/vectory/LICENSE$')" -ge 1 ]
          [ "$(dpkg-deb -c "$deb" | grep -c ' ./usr/share/doc/vectory/NOTICE$')" -ge 1 ]
          docker run --rm --network none -v "$PWD/artifacts/packages:/packages:ro" "$ALMALINUX_IMAGE" sh -euxc '
            rpm -qp --queryformat "%{NAME} %{VERSION} %{ARCH}\n" /packages/vectory-*.aarch64.rpm
            test "$(rpm -qp --queryformat "%{ARCH}" /packages/vectory-*.aarch64.rpm)" = aarch64
            test "$(rpm -qlp /packages/vectory-*.aarch64.rpm | grep -cx /usr/bin/vectory)" -ge 1
            test "$(rpm -qlp /packages/vectory-*.aarch64.rpm | grep -cx /usr/share/doc/vectory/LICENSE)" -ge 1
            test "$(rpm -qlp /packages/vectory-*.aarch64.rpm | grep -cx /usr/share/doc/vectory/NOTICE)" -ge 1
          '
  msi:
    needs: agents
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 10
        with: { name: candidate-agents, path: artifacts }
      - name: Install the pinned WiX Toolset
        timeout-minutes: 10
        shell: pwsh
        run: |
          dotnet tool install wix --version $env:WIX_VERSION --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\wix\wix.exe" --version
          exit $LASTEXITCODE
      - name: Build the MSI
        timeout-minutes: 10
        shell: pwsh
        run: |
          $version = (Select-String -Path agent/internal/agent/types.go -Pattern '^const Version = "([^"]+)"$').Matches[0].Groups[1].Value
          # MSI product versions are numeric: 0.1.0-dev installs as 0.1.0.
          $msiVersion = $version -replace '-.*$', ''
          $binary = (Resolve-Path "artifacts/releases/vectory-$version-windows-amd64.exe").Path
          New-Item -ItemType Directory -Force artifacts/msi | Out-Null
          & "$env:RUNNER_TEMP\wix\wix.exe" build packaging/windows/vectory.wxs -arch x64 -d "Version=$msiVersion" -d "Binary=$binary" -o "artifacts/msi/vectory-$version-windows-amd64.msi"
          exit $LASTEXITCODE
      - name: Install, run and remove the MSI
        timeout-minutes: 10
        shell: pwsh
        run: |
          $msi = (Get-ChildItem artifacts/msi/*.msi).FullName
          $logs = (Resolve-Path artifacts/msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "`"$logs\install.log`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec /i exited $($install.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'Vectory\vectory.exe'
          $license = Join-Path $env:ProgramFiles 'Vectory\LICENSE'
          $notice = Join-Path $env:ProgramFiles 'Vectory\NOTICE'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "vectory --version exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $license) -or -not (Test-Path -LiteralPath $notice)) { throw 'The MSI did not install LICENSE and NOTICE.' }
          if (Get-Service -Name Vectory -ErrorAction SilentlyContinue) { throw 'Installing the MSI registered a service.' }
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/l*v', "`"$logs\uninstall.log`"") -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "msiexec /x exited $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw 'The agent is still installed after removal.' }
          if ((Test-Path -LiteralPath $license) -or (Test-Path -LiteralPath $notice)) { throw 'The MSI left legal notices after removal.' }
          Write-Output "Installed, ran and removed $msi."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: candidate-msi
          # WiX also writes a .wixpdb debugging database. The candidate
          # inventory intentionally contains only the installer and test logs.
          path: |
            artifacts/msi/*.msi
            artifacts/msi/install.log
            artifacts/msi/uninstall.log
          if-no-files-found: error
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      # 30 minutes, not 10: a cold release build (thin LTO, one codegen unit,
      # SQLite at -O3) of the server, plus the agents, on a small runner.
      - name: Build the server image
        timeout-minutes: 30
        run: docker build -f deploy/Dockerfile --target runtime -t vectory-server:candidate .
      # Reuses the server stage built above.
      - name: Build the validator image
        timeout-minutes: 10
        run: docker build -f deploy/Dockerfile --target validator -t vectory-validator:candidate .
      - name: Check the images without secrets or network
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p artifacts/images
          [ "$(docker image inspect -f '{{.Config.User}}' vectory-server:candidate)" = "10001:10001" ]
          [ "$(docker image inspect -f '{{.Config.User}}' vectory-validator:candidate)" = "10002:10002" ]
          docker run --rm --network none --entrypoint vectory-admin vectory-server:candidate --version
          docker run --rm --network none --entrypoint /usr/bin/vector vectory-validator:candidate --version
          # Without TLS, a validator and a bootstrap secret the server must refuse to start.
          if timeout 60 docker run --rm --network none vectory-server:candidate > artifacts/images/server-without-settings.log 2>&1; then
            echo "::error::The server image started without its safety settings."
            exit 1
          fi
          grep -m1 'VECTORY_' artifacts/images/server-without-settings.log
          if timeout 60 docker run --rm --network none vectory-validator:candidate > artifacts/images/validator-without-isolation.log 2>&1; then
            echo "::error::The validator image started without VECTORY_VALIDATOR_ISOLATED."
            exit 1
          fi
          # The two catalogs alone cannot prove the image actually contains
          # the binaries they describe. Copy from a stopped image container,
          # hash every bundled agent, then carry its catalog into assembly.
          image_agents="$RUNNER_TEMP/image-agent-check"
          mkdir -p "$image_agents"
          image_container=$(docker create vectory-server:candidate)
          trap 'docker rm "$image_container" >/dev/null' EXIT
          docker cp "$image_container:/app/agent-releases/." "$image_agents"
          python3 packaging/check-image-agents.py "$image_agents"
          cp "$image_agents/catalog.json" artifacts/images/image-agent-catalog.json
          docker image inspect vectory-server:candidate vectory-validator:candidate > artifacts/images/images.json
      - name: Save the images
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker save vectory-server:candidate | gzip -n > artifacts/images/vectory-server-image.tar.gz
          docker save vectory-validator:candidate | gzip -n > artifacts/images/vectory-validator-image.tar.gz
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        timeout-minutes: 10
        with:
          image: vectory-server:candidate
          format: spdx-json
          output-file: artifacts/images/vectory-server-image.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        timeout-minutes: 10
        with:
          image: vectory-validator:candidate
          format: spdx-json
          output-file: artifacts/images/vectory-validator-image.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: candidate-images
          path: artifacts/images
          if-no-files-found: error
  starters:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check interrupted setup and offline restart recovery
        run: python3 deploy/test-starter-recovery.py
      - name: Build the small preview and server starter bundles
        run: python3 packaging/build-preview-bundle.py --out artifacts/starters
      - name: Verify both starter archives before uploading them
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import runpy
          from pathlib import Path

          source = Path('agent/internal/agent/types.go').read_text(encoding='utf-8')
          version = re.search(r'^const Version = "([^"]+)"$', source, re.MULTILINE).group(1)
          verify = runpy.run_path('packaging/verify-release.py')['required_starter_bundle']
          for kind in ('preview', 'server'):
              verify(Path(f'artifacts/starters/vectory-{version}-{kind}-linux-amd64.tar.gz'), version, kind)
          PY
      - name: Check the server kit uses only prebuilt images and an isolated validator
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re; print(re.search(r"^const Version = \"([^\"]+)\"$", open("agent/internal/agent/types.go").read(), re.M).group(1))')
          mkdir -p "$RUNNER_TEMP/server-kit-config"
          tar -xzf "artifacts/starters/vectory-$version-server-linux-amd64.tar.gz" -C "$RUNNER_TEMP/server-kit-config"
          kit="$RUNNER_TEMP/server-kit-config/vectory-$version-server-linux-amd64"
          export VECTORY_SERVER_IMAGE=vectory-server:ci-check
          export VECTORY_VALIDATOR_IMAGE=vectory-validator:ci-check
          export VECTORY_HOSTNAME=example.invalid
          export VECTORY_BIND_IP=127.0.0.1
          export VECTORY_SERVER_PROJECT=vectory-server-check
          docker compose --project-name "$VECTORY_SERVER_PROJECT" --env-file "$kit/.env.example" -f "$kit/compose.yaml" config --format json > "$RUNNER_TEMP/server-kit-config.json"
          python3 - "$RUNNER_TEMP/server-kit-config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          services = config['services']
          assert set(services) == {'server', 'validator', 'proxy'}
          assert all('build' not in service for service in services.values()), 'server kit unexpectedly builds from source'
          assert services['server']['image'] == 'vectory-server:ci-check'
          assert services['validator']['image'] == 'vectory-validator:ci-check'
          assert services['server']['user'] == '10001:10001'
          assert services['validator']['user'] == '10002:10002'
          assert config['networks']['validation']['internal'] is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: candidate-starters
          path: artifacts/starters
          if-no-files-found: error
  preview-smoke:
    name: starter smoke (preview and server)
    needs: [images, starters]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: candidate-images, path: artifacts/images }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: candidate-starters, path: artifacts/starters }
      - name: Start the released preview using saved candidate images, then check setup
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re; print(re.search(r"^const Version = \"([^\"]+)\"$", open("agent/internal/agent/types.go").read(), re.M).group(1))')
          release_dir="$RUNNER_TEMP/preview-release"
          extract_dir="$RUNNER_TEMP/preview-extract"
          mkdir -p "$release_dir" "$extract_dir"
          cp artifacts/images/vectory-server-image.tar.gz artifacts/images/vectory-validator-image.tar.gz "$release_dir/"
          (cd "$release_dir" && sha256sum vectory-server-image.tar.gz vectory-validator-image.tar.gz > SHA256SUMS)
          python3 - "$version" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          version = sys.argv[1]
          archive = Path(f'artifacts/starters/vectory-{version}-preview-linux-amd64.tar.gz')
          runpy.run_path('packaging/verify-release.py')['required_starter_bundle'](archive, version, 'preview')
          PY
          tar -xzf "artifacts/starters/vectory-$version-preview-linux-amd64.tar.gz" -C "$extract_dir"
          starter="$extract_dir/vectory-$version-preview-linux-amd64"
          project="vectoryci${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          export VECTORY_PREVIEW_RELEASE_DIR="$release_dir"
          export VECTORY_PREVIEW_PROJECT="$project"
          export VECTORY_PREVIEW_WEB_PORT=18080
          export VECTORY_PREVIEW_AGENT_PORT=18443
          export VECTORY_PREVIEW_VALIDATOR_PORT=18081
          cleanup() {
            local result=$?
            trap - EXIT
            if [ -f "$starter/.preview.env" ]; then
              "$starter/start.sh" stop >> "$RUNNER_TEMP/preview-start.log" 2>&1 || result=1
              docker compose --project-name "$project" --env-file "$starter/.preview.env" -f "$starter/compose.yaml" down -v >> "$RUNNER_TEMP/preview-start.log" 2>&1 || result=1
            fi
            # The PKI volume is external so Compose deliberately retains it.
            if docker volume inspect "${project}_pki" > /dev/null 2>&1; then
              docker volume rm "${project}_pki" >> "$RUNNER_TEMP/preview-start.log" 2>&1 || result=1
            fi
            rm -f "$starter/setup-secret.txt" "$RUNNER_TEMP/preview-start.log"
            exit "$result"
          }
          trap cleanup EXIT
          # The guided starter displays a bootstrap secret. Keep its output off
          # the Actions log and never upload this private temporary file.
          umask 077
          if ! "$starter/start.sh" start > "$RUNNER_TEMP/preview-start.log" 2>&1; then
            echo '::error::The saved candidate images did not start the preview.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-delay 2 http://127.0.0.1:18080/api/v1/status > "$RUNNER_TEMP/preview-status.json"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 http://127.0.0.1:18080/ > "$RUNNER_TEMP/preview-index.html"
          python3 - "$RUNNER_TEMP/preview-status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert status['initialized'] is False
          assert status.get('setup_hint')
          PY
          grep -q Vectory "$RUNNER_TEMP/preview-index.html"
          test -s "$starter/ca.pem"
          test -s "$starter/setup-secret.txt"
          test "$(stat -c %a "$starter/setup-secret.txt")" = 600
          echo 'Candidate images served a healthy loopback preview and reported first-account setup available; no device activation was attempted.'
      - name: Start the released server kit with verified TLS, bootstrap and resume
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re; print(re.search(r"^const Version = \"([^\"]+)\"$", open("agent/internal/agent/types.go").read(), re.M).group(1))')
          project="vectoryserverci${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          extract_dir="$RUNNER_TEMP/serverkit-extract-$project"
          fixture_dir="$RUNNER_TEMP/serverkit-fixture-$project"
          log="$RUNNER_TEMP/serverkit-$project.log"
          mkdir -p "$extract_dir" "$fixture_dir"
          kit="$extract_dir/vectory-$version-server-linux-amd64"
          cleanup() {
            local result=$?
            trap - EXIT
            if [ -f "$kit/.env" ]; then
              "$kit/start.sh" stop >> "$log" 2>&1 || result=1
              docker compose --project-name "$project" --env-file "$kit/.env" -f "$kit/compose.yaml" down -v >> "$log" 2>&1 || result=1
            fi
            for suffix in data secrets fixture; do
              volume="${project}_$suffix"
              if docker volume inspect "$volume" > /dev/null 2>&1; then
                docker volume rm "$volume" >> "$log" 2>&1 || result=1
              fi
            done
            rm -f "$fixture_dir"/* "$log"
            rmdir "$fixture_dir" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          umask 077
          python3 - "$version" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          version = sys.argv[1]
          archive = Path(f'artifacts/starters/vectory-{version}-server-linux-amd64.tar.gz')
          runpy.run_path('packaging/verify-release.py')['required_starter_bundle'](archive, version, 'server')
          PY
          tar -xzf "artifacts/starters/vectory-$version-server-linux-amd64.tar.gz" -C "$extract_dir"
          # Match a security-conscious operator extracting with umask 077.
          # The verified public proxy config starts unreadable to UID 10001;
          # the starter must restore only that file's intended 0644 mode.
          test "$(stat -c %a "$kit/Caddyfile")" = 600
          docker volume create --label io.vectory.ci=true "${project}_fixture" > /dev/null
          fixture_mount="type=volume,src=${project}_fixture,dst=/var/lib/vectory"
          helper=(docker run --rm --network none --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges:true --mount "$fixture_mount" --entrypoint /app/operations/vectory-local-pki vectory-server:candidate)
          exporter=(docker run --rm --network none --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges:true --mount "$fixture_mount" --entrypoint cat vectory-server:candidate)
          "${helper[@]}" --out /var/lib/vectory/pki --hosts localhost,127.0.0.1 --days 7 > "$log" 2>&1
          "${helper[@]}" --out /var/lib/vectory/wrong --hosts localhost,127.0.0.1 --days 7 >> "$log" 2>&1
          "${exporter[@]}" /var/lib/vectory/pki/ca.pem > "$fixture_dir/ca.pem"
          "${exporter[@]}" /var/lib/vectory/pki/server.pem > "$fixture_dir/chain.pem"
          "${exporter[@]}" /var/lib/vectory/pki/ca.pem >> "$fixture_dir/chain.pem"
          "${exporter[@]}" /var/lib/vectory/pki/server-key.pem > "$fixture_dir/key.pem"
          "${exporter[@]}" /var/lib/vectory/wrong/ca.pem > "$fixture_dir/wrong-ca.pem"
          test "$(stat -c %a "$fixture_dir/key.pem")" = 600
          export VECTORY_SERVER_PROJECT="$project"
          export VECTORY_HOSTNAME=localhost
          export VECTORY_BIND_IP=127.0.0.1
          export VECTORY_TLS_CERT_FILE="$fixture_dir/chain.pem"
          export VECTORY_TLS_KEY_FILE="$fixture_dir/key.pem"
          export VECTORY_PREVIEW_RELEASE_DIR="$RUNNER_TEMP/preview-release"
          # The guided starter prints the bootstrap secret. Keep all its output
          # private, including stop and resume, and never upload the fixture.
          if ! "$kit/start.sh" start >> "$log" 2>&1; then
            # Report only fixed diagnostic categories. The private log can
            # contain the first-account setup secret, so never print its lines.
            python3 - "$log" <<'PY'
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').lower()
          phase = ('compose startup' if 'starting the server, tls proxy' in output else
                   'certificate setup' if 'checking your certificate' in output else
                   'image loading' if 'loading verified' in output else 'preflight')
          if 'caddyfile' in output and 'permission denied' in output:
              cause = 'proxy configuration permission denied'
          elif 'permission denied' in output:
              cause = 'file or volume permission denied'
          elif 'port is already allocated' in output or 'address already in use' in output:
              cause = 'host port unavailable'
          elif 'toomanyrequests' in output or 'rate limit' in output or 'pull access denied' in output:
              cause = 'proxy image download failed'
          elif 'unhealthy' in output or 'did not become healthy' in output:
              cause = 'a service did not become healthy'
          elif 'no space left' in output:
              cause = 'runner storage exhausted'
          else:
              cause = 'unclassified failure'
          print(f'::error::Server kit failed during {phase}: {cause}. Private startup output was not published.')
          PY
            exit 1
          fi
          test "$(stat -c %a "$kit/Caddyfile")" = 644
          test "$(stat -c %a "$kit/releases")" = 755
          test "$(stat -c %a "$kit/.env")" = 600
          server_compose=(docker compose --project-name "$project" --env-file "$kit/.env" -f "$kit/compose.yaml")
          curl --noproxy '*' --fail --silent --show-error --retry 6 --retry-delay 2 --cacert "$fixture_dir/ca.pem" --resolve localhost:443:127.0.0.1 https://localhost/api/v1/status > "$fixture_dir/status.json"
          python3 - "$fixture_dir/status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          assert json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['initialized'] is False
          PY
          # The agent listener must present the expected CA and reject another.
          curl --noproxy '*' --silent --show-error --cacert "$fixture_dir/ca.pem" --resolve localhost:8443:127.0.0.1 https://localhost:8443/ -o /dev/null
          wrong_ca_result=0
          curl --noproxy '*' --silent --show-error --cacert "$fixture_dir/wrong-ca.pem" --resolve localhost:8443:127.0.0.1 https://localhost:8443/ -o /dev/null 2> "$fixture_dir/wrong-ca-error.txt" || wrong_ca_result=$?
          test "$wrong_ca_result" = 60
          "${server_compose[@]}" exec -T server cat /run/secrets/bootstrap > "$fixture_dir/setup-secret.txt"
          python3 - "$fixture_dir/setup-secret.txt" "$fixture_dir/bootstrap.json" <<'PY'
          import json
          import secrets
          import sys
          from pathlib import Path

          secret = Path(sys.argv[1]).read_text(encoding='utf-8').strip()
          assert len(secret) >= 24
          payload = {
              'name': 'Candidate smoke administrator',
              'email': 'candidate-smoke@example.invalid',
              'password': secrets.token_urlsafe(32),
              'bootstrap_secret': secret,
          }
          Path(sys.argv[2]).write_text(json.dumps(payload), encoding='utf-8')
          PY
          curl --noproxy '*' --fail --silent --show-error --cacert "$fixture_dir/ca.pem" --resolve localhost:443:127.0.0.1 --header 'Content-Type: application/json' --data-binary @"$fixture_dir/bootstrap.json" https://localhost/api/v1/bootstrap > "$fixture_dir/bootstrap-response.json"
          "${server_compose[@]}" exec -T server curl --fail --silent http://127.0.0.1:8080/api/v1/status > "$fixture_dir/status.json"
          python3 - "$fixture_dir/status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          assert json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['initialized'] is True
          PY
          "$kit/start.sh" stop >> "$log" 2>&1
          "$kit/start.sh" start >> "$log" 2>&1
          curl --noproxy '*' --fail --silent --show-error --retry 6 --retry-delay 2 --cacert "$fixture_dir/ca.pem" --resolve localhost:443:127.0.0.1 https://localhost/api/v1/status > "$fixture_dir/status.json"
          python3 - "$fixture_dir/status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          assert json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['initialized'] is True
          PY
          echo 'Saved candidate images and the source-free server kit passed verified TLS, first-admin bootstrap and state-preserving restart; no device activation was attempted.'
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
      - name: Unit-test the license inventory
        timeout-minutes: 10
        run: python3 packaging/test_license_inventory.py
      - name: Unit-test the npm advisory gate
        timeout-minutes: 10
        run: python3 packaging/test_audit_npm.py
      - name: CycloneDX SBOM of the server's Rust dependencies
        timeout-minutes: 10
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo +1.94.0 cyclonedx --manifest-path server/Cargo.toml --format json --override-filename vectory-server.cdx
          mkdir -p artifacts/sbom
          mv server/vectory-server.cdx.json artifacts/sbom/
      - name: CycloneDX SBOM of the agent's Go dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/tools"
          sum=$(cd "$RUNNER_TEMP" && go mod download -json "$CYCLONEDX_GOMOD_MODULE@$CYCLONEDX_GOMOD_VERSION" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Sum"])')
          [ "$sum" = "$CYCLONEDX_GOMOD_SUM" ] || { echo "::error::cyclonedx-gomod $CYCLONEDX_GOMOD_VERSION has hash $sum, expected $CYCLONEDX_GOMOD_SUM"; exit 1; }
          go install "$CYCLONEDX_GOMOD_MODULE/cmd/cyclonedx-gomod@$CYCLONEDX_GOMOD_VERSION"
          mkdir -p artifacts/sbom
          cd agent
          # The Linux amd64 build; the other targets compile the same two modules.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 "$GOBIN/cyclonedx-gomod" app -json -licenses -assert-licenses -main cmd/vectory -output ../artifacts/sbom/vectory-agent.cdx.json
      - name: CycloneDX SBOMs of the dashboard's and help center's npm dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          (cd dashboard && npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application --omit dev) > artifacts/sbom/vectory-dashboard.cdx.json
          (cd help-center && npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application --omit dev) > artifacts/sbom/vectory-help-center.cdx.json
      - name: No unacknowledged high or critical advisory in the npm dependencies that ship
        timeout-minutes: 10
        run: python3 packaging/audit-npm.py --out artifacts/sbom/npm-dependency-audit.json
      - name: License inventory, source lockfile inventory and source bytes
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 packaging/license-inventory.py artifacts/sbom/*.cdx.json --out artifacts/sbom
          python3 packaging/generate-sbom.py --out artifacts/sbom/source.spdx.json
          python3 packaging/record-source.py --out artifacts/sbom/SOURCE-INPUTS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          name: candidate-sbom
          path: artifacts/sbom
          if-no-files-found: error
  assemble:
    needs: [agents, packages, msi, images, sbom, starters, preview-smoke]
    if: ${{ !cancelled() && needs.agents.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 10
        with: { pattern: candidate-*, path: artifacts/parts }
      - name: Gather every part into one folder with a manifest and SHA256SUMS
        timeout-minutes: 10
        env:
          PACKAGES_RESULT: ${{ needs.packages.result }}
          MSI_RESULT: ${{ needs.msi.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          STARTERS_RESULT: ${{ needs.starters.result }}
          PREVIEW_SMOKE_RESULT: ${{ needs['preview-smoke'].result }}
        run: |
          set -euo pipefail
          out=artifacts/unsigned-release-candidate
          mkdir -p "$out"
          duplicates=$(find artifacts/parts -type f -printf '%f\n' | sort | uniq -d)
          [ -z "$duplicates" ] || { echo "::error::Two parts hold the same file name: $duplicates"; exit 1; }
          find artifacts/parts -type f -exec cp {} "$out/" \;
          python3 packaging/candidate-manifest.py "$out"
          python3 packaging/verify-release.py "$out" --refresh-checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: unsigned-release-candidate
          path: artifacts/unsigned-release-candidate
          if-no-files-found: error
  verify:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 10
        with: { name: unsigned-release-candidate, path: artifacts/releases }
      - name: Check the downloaded candidate against its checksums, as a reader of the release page would
        timeout-minutes: 10
        run: |
          set -euo pipefail
          (cd artifacts/releases && sha256sum -c SHA256SUMS)
          python3 packaging/verify-release.py artifacts/releases
  attest:
    needs: assemble
    if: ${{ inputs.attest }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: unsigned-release-candidate, path: artifacts/releases }
      - run: python3 packaging/verify-release.py artifacts/releases
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/releases/SHA256SUMS
