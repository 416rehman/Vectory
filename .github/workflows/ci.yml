        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/pipeline-local-check-browser.mjs
        env:
          VECTORY_PIPELINE_LOCAL_CHECK_OUTPUT: artifacts/browsers/pipeline-local-check
      - name: Check pipeline nodes on the canvas
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/pipeline-node-browser.mjs
        env:
          VECTORY_PIPELINE_NODE_OUTPUT: artifacts/browsers/pipeline-node
      - name: Check publish recovery
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/publish-recovery-browser.mjs
        env:
          VECTORY_PUBLISH_RECOVERY_OUTPUT: artifacts/browsers/publish-recovery
      - name: Check retired deployment targets
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/retired-targets-browser.mjs
        env:
          VECTORY_RETIRED_TARGETS_OUTPUT: artifacts/browsers/retired-targets
      - name: Check reviewed rollback and its recovery
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/reviewed-rollback-browser.mjs
        env:
          VECTORY_REVIEWED_ROLLBACK_OUTPUT: artifacts/browsers/reviewed-rollback
      - name: Check reviewed assignment removal
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/reviewed-unassignment-browser.mjs
        env:
          VECTORY_UNASSIGNMENT_OUTPUT: artifacts/browsers/reviewed-unassignment
      - name: Check the role picker
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/role-picker-browser.mjs
        env:
          VECTORY_ROLE_PICKER_OUTPUT: artifacts/browsers/role-picker
      - name: Check rollback recovery
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/rollback-recovery-browser.mjs
        env:
          VECTORY_ROLLBACK_RECOVERY_OUTPUT: artifacts/browsers/rollback-recovery
      - name: Check refresh-and-review of scheduled deployments
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/scheduled-refresh-browser.mjs
        env:
          VECTORY_SCHEDULED_REFRESH_OUTPUT: artifacts/browsers/scheduled-refresh
      - name: Check schema-driven field controls
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/schema-control-browser.mjs
      - name: Check the device secret picker
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/secret-picker-browser.mjs
        env:
          VECTORY_SECRET_PICKER_OUTPUT: artifacts/browsers/secret-picker
      - name: Check target handoff
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/target-handoff-browser.mjs
        env:
          VECTORY_TARGET_HANDOFF_OUTPUT: artifacts/browsers/target-handoff
      - name: Check target recovery
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/target-recovery-browser.mjs
        env:
          VECTORY_TARGET_RECOVERY_OUTPUT: artifacts/browsers/target-recovery
      - name: Check the publish review runs the tests and says how they went
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/publish-tests-browser.mjs
        env:
          VECTORY_PUBLISH_TESTS_OUTPUT: artifacts/browsers/publish-tests
      - name: Check the canary lane, its delivery table and the canary choice
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/canary-lane-browser.mjs
        env:
          VECTORY_CANARY_LANE_OUTPUT: artifacts/browsers/canary-lane
      - name: Check that a device held on its previous version reads the same everywhere
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/health-held-browser.mjs
        env:
          VECTORY_HEALTH_HELD_OUTPUT: artifacts/browsers/health-held
      - name: Check the live graph reads at 1440 px, in light and dark, and its numbers are in a table
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/live-graph-browser.mjs
        env:
          VECTORY_LIVE_GRAPH_OUTPUT: artifacts/browsers/live-graph
      - name: Check that deploying a pipeline that runs starts from the devices that run it
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/deploy-preselection-browser.mjs
        env:
          VECTORY_DEPLOY_PRESELECTION_OUTPUT: artifacts/browsers/deploy-preselection
      - name: Check that toasts stack above the status bar and any dialog's buttons
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/toast-placement-browser.mjs
        env:
          VECTORY_TOAST_PLACEMENT_OUTPUT: artifacts/browsers/toast-placement
      # Last and independent, so a stale table never hides a harness result.
      - name: Check docs/internal/CI.md lists every job of every workflow
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: .
        run: node scripts/check-ci-table.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: dashboard-browsers
          path: |
            artifacts/browsers
            .local/mfa-recovery-browser
            docs/evidence/schema-controls-browser*.json
            !**/vite-cache/**
          if-no-files-found: warn
