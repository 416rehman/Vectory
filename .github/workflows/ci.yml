name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.94.0 --profile minimal
      - name: Provide pinned Vector for native validator tests
        run: |
          image='timberio/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9'
          container_id="$(docker create "$image")"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp -L "$container_id:/usr/bin/vector" "$RUNNER_TEMP/vector"
          chmod +x "$RUNNER_TEMP/vector"
          "$RUNNER_TEMP/vector" --version
          echo "VECTORY_TEST_VECTOR=$RUNNER_TEMP/vector" >> "$GITHUB_ENV"
      - run: cargo +1.94.0 test --locked --manifest-path server/Cargo.toml
      - run: cargo +1.94.0 build --locked --manifest-path server/Cargo.toml
      - run: cargo +1.94.0 install cargo-audit --version 0.22.2 --locked
      - run: python3 packaging/audit-rust.py --out artifacts/rust-dependency-audit.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version: "1.26.8", cache: false }
      - run: go test -v tests/security/protocol_test.go
        env:
          VECTORY_SECURITY_SERVER: ${{ github.workspace }}/server/target/debug/vectory-server
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: help-center
      - run: npm test
      - name: Check dashboard formatting
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: npx prettier --check src tests e2e
      - name: Check typed variable wire schemas
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: node ../tests/variable-contract.mjs
      # tests/contracts.mjs needs a live instance with data, so it runs in the
      # end-to-end job after the workflow.
      - name: Check the generated OpenAPI and protocol schemas are current
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          node contracts/generate.mjs
          if [ -n "$(git status --porcelain -- contracts)" ]; then
            git status --short -- contracts
            git --no-pager diff --stat -- contracts
            echo "::error::contracts/ is not what contracts/generate.mjs produces. Run node contracts/generate.mjs and commit the result."
            exit 1
          fi
      - name: Check generated Vector catalog, VRL reference and device-secret tables are current
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          node scripts/generate-vector-catalog.mjs --check
          node scripts/generate-vrl-functions.mjs --check
          node scripts/generate-secret-fields.mjs --check
        working-directory: .
      - name: Check help Markdown, links, writing rules and reference drift
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: node --test help-center/scripts/*.test.mjs
        working-directory: .
      - name: Check that repository records link only to committed files
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-doc-links.test.mjs
          node scripts/check-doc-links.mjs
        working-directory: .
      - name: Check the requirements checklist against the specification and the repository
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-requirements.test.mjs
          node scripts/check-requirements.mjs
        working-directory: .
      - id: build
        if: ${{ !cancelled() }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Check the shared resource hook against stale, slow and interleaved replies
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/resource-race.mjs
        working-directory: .
        env:
          VECTORY_RESOURCE_RACE_EVIDENCE: artifacts/resource-race.json
      - name: Check shared column sorting, filtering and keyboard access
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/data-table-browser.mjs
      - name: Check fleet, group, policy and target tables
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/fleet-tables-browser.mjs
        env:
          VECTORY_FLEET_TABLES_OUTPUT: artifacts/fleet-tables
      - name: Check one page header, the first Tab stop and dialog focus return
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/page-chrome-browser.mjs
        env:
          VECTORY_PAGE_CHROME_OUTPUT: artifacts/page-chrome
      - name: Check library session boundaries and navigation state
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/pipeline-library-browser.mjs
        env:
          VECTORY_LIBRARY_COMPONENT_OUTPUT: artifacts/pipeline-library-component
      - name: Check pipeline creation recovery and missing-name feedback
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/pipeline-create-recovery-browser.mjs
        env:
          VECTORY_PIPELINE_CREATION_OUTPUT: artifacts/pipeline-creation-recovery
      - name: Check enrollment identity and pending-token boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/enrollment-browser.mjs
        env:
          VECTORY_ENROLLMENT_COMPONENT_OUTPUT: artifacts/enrollment-component
      - name: Check bounded deployment navigation and actions
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/deployments-browser.mjs
        env:
          VECTORY_DEPLOYMENTS_COMPONENT_OUTPUT: artifacts/deployments-component
      - name: Check issue disposition, review races and accessibility
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/issues-browser.mjs
        env:
          VECTORY_ISSUES_COMPONENT_OUTPUT: artifacts/issues-component
      - name: Check notification channels, delivery log, detection thresholds and the setup tip
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/notifications-browser.mjs
        env:
          VECTORY_NOTIFICATIONS_OUTPUT: artifacts/notifications-component
      - name: Check audit browsing, reviewed exports and accessible navigation
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/audit-browser.mjs
        env:
          VECTORY_AUDIT_COMPONENT_OUTPUT: artifacts/audit-component
      - name: Check people and telemetry column sorting, filtering and accessibility
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/account-metrics-tables-browser.mjs
        env:
          VECTORY_ACCOUNT_METRICS_TABLES_OUTPUT: artifacts/account-metrics-tables
      - name: Check deployment permalinks and navigation boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/deployment-routing-browser.mjs
        env:
          VECTORY_DEPLOYMENT_ROUTING_OUTPUT: artifacts/deployment-routing
      - name: Check staged sign-in and partial-authentication UI boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/staged-login-browser.mjs
        env:
          VECTORY_STAGED_LOGIN_OUTPUT: artifacts/staged-login
      - name: Check local authenticator QR, recovery handoff and accessibility
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/authenticator-setup-browser.mjs
        env:
          VECTORY_AUTHENTICATOR_SETUP_OUTPUT: artifacts/authenticator-setup
      - name: Check mobile authenticator action layout
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/authenticator-setup-browser.mjs
        env:
          VECTORY_AUTHENTICATOR_SETUP_FOCUS: mobile-footer
          VECTORY_AUTHENTICATOR_SETUP_OUTPUT: artifacts/authenticator-mobile-footer
      - name: Check contextual page help and unfinished editor fields
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/page-help-browser.mjs
        env:
          VECTORY_PAGE_HELP_OUTPUT: artifacts/page-help
      - name: Check collapsible sidebar, mobile focus and editor resizing
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/sidebar-browser.mjs
        env:
          VECTORY_SIDEBAR_OUTPUT: artifacts/sidebar-navigation
      - name: Check the command palette, shortcuts and search results
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/command-palette-browser.mjs
      - name: Check Overview actions and typed activity destinations
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/overview-browser.mjs
        env:
          VECTORY_OVERVIEW_OUTPUT: artifacts/overview-navigation
      - name: Check canvas creation, named connections and pending-edit guards
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/editor-canvas-browser.mjs
        env:
          VECTORY_EDITOR_CANVAS_OUTPUT: artifacts/editor-canvas
      - name: Check rich code editing and reviewed file import boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/editor-code-import-browser.mjs
        env:
          VECTORY_EDITOR_CODE_IMPORT_OUTPUT: artifacts/editor-code-import
      - name: Check pipeline candidate, schema and discarded Code results
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/pipeline-check-schema-browser.mjs
      - name: Check component inspector fields, raw JSON and accessibility
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/inspector-browser.mjs
        env:
          VECTORY_INSPECTOR_OUTPUT: artifacts/inspector-component
      - name: Check compact component search results at desktop and mobile widths
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/editor-canvas-browser.mjs
        env:
          VECTORY_EDITOR_CANVAS_FOCUS: menu-layout
          VECTORY_EDITOR_CANVAS_OUTPUT: artifacts/editor-canvas-menu-layout
      - name: Check pipeline validation results stay inside narrow viewports
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/editor-canvas-browser.mjs
        env:
          VECTORY_EDITOR_CANVAS_FOCUS: check-results
          VECTORY_EDITOR_CANVAS_OUTPUT: artifacts/editor-canvas-check-results
      - name: Check pipeline validation states and operator preflight
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/editor-canvas-browser.mjs
        env:
          VECTORY_EDITOR_CANVAS_FOCUS: check-state
          VECTORY_EDITOR_CANVAS_OUTPUT: artifacts/editor-canvas-check-state
      - name: Check enrollment connection and service setup guidance
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/enrollment-connection-browser.mjs
        env:
          VECTORY_ENROLLMENT_CONNECTION_OUTPUT: artifacts/enrollment-connection
      - run: rustup toolchain install 1.94.0 --profile minimal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Build the isolated help test server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bin vectory-server
        working-directory: .
      - name: Exercise bundled help and account workflows on a fresh instance
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node help-center/tests/ci.mjs
        working-directory: .
        env:
          VECTORY_HELP_ACCOUNT_TESTS: "true"
          VECTORY_HELP_CI_OUTPUT: artifacts/help-account-ci
      - name: Verify staged MFA, account authorization and reset races on isolated instances
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/account-review.mjs
        working-directory: .
        env:
          VECTORY_ACCOUNT_EVIDENCE: artifacts/account-review.json
      - name: Verify pipeline lifecycle authorization and immutable history
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/pipeline-review.mjs
        working-directory: .
        env:
          VECTORY_PIPELINE_EVIDENCE: artifacts/pipeline-review.json
      - name: Verify bounded library metadata and query isolation
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/library-review.mjs
        working-directory: .
        env:
          VECTORY_LIBRARY_EVIDENCE: artifacts/library-review.json
      - name: Verify rollback priority and transaction boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/rollback-review.mjs
        working-directory: .
        env:
          VECTORY_ROLLBACK_EVIDENCE: artifacts/rollback-review.json
      - name: Verify bounded deployment history and target isolation
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/deployment-history-review.mjs
        working-directory: .
        env:
          VECTORY_DEPLOYMENT_HISTORY_EVIDENCE: artifacts/deployment-history-review.json
      - name: Verify durable audit chronology and migration boundaries
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/audit-order-review.mjs
        working-directory: .
        env:
          VECTORY_AUDIT_ORDER_EVIDENCE: artifacts/audit-order-review.json
      - name: Verify issue acknowledgement authorization and transactions
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/issue-review.mjs
        working-directory: .
        env:
          VECTORY_ISSUE_EVIDENCE: artifacts/issue-review.json
      - name: Verify bounded audit queries and private snapshot export lifecycle
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/audit-review.mjs
        working-directory: .
        env:
          VECTORY_AUDIT_EVIDENCE: artifacts/audit-review.json
      - name: Check the resource hook's polling, deadlines and cancellation with controlled timers
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/resource-polling.mjs
        working-directory: .
        env:
          VECTORY_RESOURCE_REPORT: artifacts/resource-polling.json
      - name: Check pinned Vector schema fixtures round-trip losslessly
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/schema-fixtures.mjs
        working-directory: .
        env:
          VECTORY_SCHEMA_FIXTURES_EVIDENCE: artifacts/schema-fixtures.json
      - name: Check schema controls keep values through rename, reorder and null
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/schema-review.mjs
        working-directory: .
        env:
          VECTORY_SCHEMA_REVIEW_EVIDENCE: artifacts/schema-review.json
      - name: Check failed page loads recover inside the production build
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/lazy-page-recovery-review.mjs
        working-directory: .
        env:
          VECTORY_LAZY_PAGE_OUTPUT: artifacts/lazy-page-recovery
      - name: Check the device page never shows or acts on another record's reply
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/device-identity-review.mjs
        working-directory: .
        env:
          VECTORY_DEVICE_IDENTITY_OUTPUT: artifacts/device-identity
      - name: Check retried application keeps its reviewed preconditions
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/device-retry-context-review.mjs
        working-directory: .
        env:
          VECTORY_DEVICE_RETRY_CONTEXT_OUTPUT: artifacts/device-retry-context
      - name: Check revoking a device confirms from its exact status
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/device-revocation-review.mjs
        working-directory: .
        env:
          VECTORY_DEVICE_REVOCATION_OUTPUT: artifacts/device-revocation
      - name: Check authorizing device recovery shows its token once and never resends
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/security/device-recovery-request-review.mjs
        working-directory: .
        env:
          VECTORY_DEVICE_RECOVERY_REQUEST_OUTPUT: artifacts/device-recovery-request
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: help-and-account-acceptance
          path: |
            artifacts/help-account-ci
            artifacts/account-review.json
            artifacts/pipeline-review.json
            artifacts/pipeline-library-component
            artifacts/pipeline-creation-recovery
            artifacts/enrollment-component
            artifacts/enrollment-connection
            artifacts/deployments-component
            artifacts/issues-component
            artifacts/audit-component
            artifacts/account-metrics-tables
            artifacts/fleet-tables
            .local/data-table-review
            artifacts/deployment-routing
            artifacts/staged-login
            artifacts/authenticator-setup
            artifacts/authenticator-mobile-footer
            artifacts/page-help
            artifacts/sidebar-navigation
            artifacts/overview-navigation
            artifacts/editor-canvas
            artifacts/editor-code-import
            .local/pipeline-check-schema
            artifacts/inspector-component
            artifacts/editor-canvas-menu-layout
            artifacts/editor-canvas-check-results
            artifacts/editor-canvas-check-state
            artifacts/library-review.json
            artifacts/rollback-review.json
            artifacts/deployment-history-review.json
            artifacts/audit-order-review.json
            artifacts/issue-review.json
            artifacts/audit-review.json
            artifacts/resource-race.json
            artifacts/resource-polling.json
            artifacts/schema-fixtures.json
            artifacts/schema-review.json
            artifacts/lazy-page-recovery
            artifacts/device-identity
            artifacts/device-retry-context
            artifacts/device-revocation
            artifacts/device-recovery-request
            artifacts/page-chrome
          if-no-files-found: warn
  agent:
    strategy:
      fail-fast: false
      matrix:
        # The official Vector 0.58.0 release archive for each runner, pinned by
        # the SHA-256 that vector-0.58.0-SHA256SUMS lists for it.
        include:
          - os: ubuntu-24.04
            vector-archive: vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz
            vector-sha256: a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09
            vector-binary: vector-x86_64-unknown-linux-gnu/bin/vector
          - os: windows-2025
            vector-archive: vector-0.58.0-x86_64-pc-windows-msvc.zip
            vector-sha256: 72bbedf4772302f7f67e7db2120fe5b42e39ae65873c895876fc2038050c10c5
            vector-binary: bin/vector.exe
          - os: macos-15
            vector-archive: vector-0.58.0-arm64-apple-darwin.tar.gz
            vector-sha256: 9182491597f1bdedb08d84a051616c62deea770a9d905b697712cc6526919449
            vector-binary: vector-arm64-apple-darwin/bin/vector
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      # Native agent tests (drain, reload and rollback, telemetry, secret
      # rotation, full mode) run only when VECTOR_TEST_BINARY is set. A checksum
      # mismatch fails the job; it never falls back to skipping them.
      - name: Provide pinned Vector for native agent tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          VECTOR_ARCHIVE: ${{ matrix.vector-archive }}
          VECTOR_SHA256: ${{ matrix.vector-sha256 }}
          VECTOR_BINARY: ${{ matrix.vector-binary }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | shasum -a 256 -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/$VECTOR_BINARY"
          version="$("$binary" --version)"
          echo "$version"
          [[ "$version" == "vector 0.58.0 "* ]]
          echo "VECTOR_TEST_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Provide pinned Vector for native agent tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VECTOR_ARCHIVE: ${{ matrix.vector-archive }}
          VECTOR_SHA256: ${{ matrix.vector-sha256 }}
          VECTOR_BINARY: ${{ matrix.vector-binary }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP $env:VECTOR_ARCHIVE
          Invoke-WebRequest -Uri "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$env:VECTOR_ARCHIVE" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:VECTOR_SHA256) { throw "Checksum mismatch for $($env:VECTOR_ARCHIVE): expected $($env:VECTOR_SHA256), got $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'vector'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = (Get-Item -LiteralPath (Join-Path $destination $env:VECTOR_BINARY)).FullName
          $version = & $binary --version
          Write-Output $version
          if ($LASTEXITCODE -ne 0 -or -not "$version".StartsWith('vector 0.58.0 ')) { throw "Unexpected Vector build at ${binary}: $version" }
          "VECTOR_TEST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append
      # The JSON stream is the evidence that the native tests ran: the check
      # after it fails when one skipped although VECTOR_TEST_BINARY is set, and
      # prints the output of every failure, which the stream keeps out of this log.
      - name: Run the agent tests (go test -json)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        working-directory: agent
        run: |
          mkdir -p ../artifacts
          go test -json ./... > ../artifacts/agent-go-test.json
      - name: Run the agent tests (go test -json)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        working-directory: agent
        run: |
          New-Item -ItemType Directory -Force -Path ../artifacts | Out-Null
          go test -json ./... > ../artifacts/agent-go-test.json
          exit $LASTEXITCODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        with:
          node-version: "22"
      - name: Unit-test the native test check
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node --test scripts/check-native-tests.test.mjs
      - name: Prove the native tests ran with the pinned Vector
        if: ${{ !cancelled() && hashFiles('artifacts/agent-go-test.json') != '' }}
        timeout-minutes: 10
        run: node scripts/check-native-tests.mjs artifacts/agent-go-test.json --require-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('artifacts/agent-go-test.json') != '' }}
        timeout-minutes: 10
        with:
          name: agent-go-test-${{ matrix.os }}
          path: artifacts/agent-go-test.json
          if-no-files-found: error
      - run: go vet ./...
        working-directory: agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: agent
  operational:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - run: python packaging/test_verify_release.py
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          VECTORY_HOSTNAME: localhost
          VECTORY_TLS_CERT_FILE: /tmp/test.pem
          VECTORY_TLS_KEY_FILE: /tmp/test-key.pem
          VECTORY_BOOTSTRAP_SECRET_FILE: /tmp/bootstrap
      - run: docker build -f deploy/Dockerfile -t vectory-ci .
      - run: docker build -f deploy/Dockerfile --target validator -t vectory-validator-ci .
  # Specification section 15, first acceptance test, on a fresh instance: the
  # first administrator, the agent downloaded from the release listing and
  # checked by SHA-256, then install, enroll, publish, assign, heartbeat,
  # fetch, validate, activate and observe with the pinned Vector. The Add
  # device installer, the live API schemas and the starter pipelines follow.
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VECTORY_PREVIEW_DIR: ${{ github.workspace }}/.local/preview
      VECTORY_NATIVE_WORKFLOW_OUTPUT: artifacts/end-to-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - name: Install the dashboard packages the checks load
        timeout-minutes: 10
        working-directory: dashboard
        run: npm ci
      - name: Build the dashboard the instance serves
        id: dashboard
        timeout-minutes: 10
        run: |
          (cd help-center && npm ci)
          (cd dashboard && npm run build)
      - name: Build the server, the validator and vectory-admin
        timeout-minutes: 10
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bins
      - name: Provide the pinned Vector 0.58.0
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz
          VECTOR_SHA256: a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | sha256sum -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/vector-x86_64-unknown-linux-gnu/bin/vector"
          version="$("$binary" --version)"
          echo "$version"
          [[ "$version" == "vector 0.58.0 "* ]]
          echo "VECTORY_PREVIEW_VECTOR=$binary" >> "$GITHUB_ENV"
          echo "VECTORY_VECTOR_BIN=$binary" >> "$GITHUB_ENV"
      - name: Start a fresh instance with the real validator and agents for every platform
        id: instance
        timeout-minutes: 10
        run: scripts/preview.sh start
      - name: Run the clean-install workflow with the downloaded agent
        id: workflow
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 10
        run: node tests/native-workflow.mjs
      - name: Install and enroll a second device with the Add device installer
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 10
        env:
          VECTORY_URL: http://127.0.0.1:8080
          VECTORY_CA_FILE: ${{ github.workspace }}/.local/pki/ca.pem
          VECTORY_CREDENTIALS: ${{ github.workspace }}/.local/preview/credentials.json
          VECTORY_BOOTSTRAP_SECRET_FILE: ${{ github.workspace }}/.local/preview/bootstrap.secret
        run: node scripts/check-installer.mjs --output artifacts/end-to-end
      - name: Check live API responses against the shared schemas
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          mkdir -p docs/evidence artifacts/end-to-end
          node tests/contracts.mjs
          cp docs/evidence/contract-tests.json artifacts/end-to-end/
      # Installed only here, so a failed browser download never hides the
      # results above.
      - name: Install Chromium for the dashboard specs
        id: chromium
        if: ${{ !cancelled() && steps.dashboard.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      # The dashboard specs that pass against a real instance with this data;
      # the others and why are in docs/internal/CI.md.
      - name: Run the dashboard specs against the instance, including a 201-component pipeline
        if: ${{ !cancelled() && steps.instance.outcome == 'success' && steps.chromium.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: dashboard
        env:
          VECTORY_UI_URL: http://127.0.0.1:8080
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/artifacts/end-to-end/dashboard-specs.json
        run: |
          mkdir -p ../docs/evidence
          npx playwright test e2e/concurrency.spec.ts e2e/issues-history.spec.ts e2e/performance.spec.ts e2e/pipeline-create-entry.spec.ts --reporter=list,json
          cp ../docs/evidence/browser-performance.json ../artifacts/end-to-end/
      - name: Validate every starter pipeline with the pinned Vector
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node tests/templates.mjs
      - name: Stop the agent and the instance, and collect their logs
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          mkdir -p artifacts/end-to-end/logs
          run="$VECTORY_PREVIEW_DIR/native-run.json"
          if [ -f "$run" ]; then
            pid=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).pid' "$run")
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid"
              for _ in $(seq 1 90); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
              kill -0 "$pid" 2>/dev/null && kill -KILL "$pid"
            fi
          fi
          scripts/preview.sh stop
          cp "$VECTORY_PREVIEW_DIR"/server.log "$VECTORY_PREVIEW_DIR"/validator.log artifacts/end-to-end/logs/
          # Logs only: the agent's state folder also holds its private key.
          for dir in "$GITHUB_WORKSPACE"/.local/native\ workflow\ */; do
            cp "$dir"agent.log "$dir"agent-error.log "$dir"state/vector.log* artifacts/end-to-end/logs/
          done
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: end-to-end
          path: |
            artifacts/end-to-end
            dashboard/test-results
          if-no-files-found: warn
  # The Compose quickstart as a first-time operator runs it (docs/user/install-server.md):
  # a private CA, protected secret files, deploy/.env, build, start, first
  # administrator, a device enrolled through the published agent port with the
  # agent bundled in the image, and the validator's isolation, probed from inside.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 10
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
      - name: Create a private CA, the certificate chain and the bootstrap secret
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go run ../packaging/dev-pki/main.go --out "$RUNNER_TEMP/pki" --hosts localhost,127.0.0.1
          (umask 077 && openssl rand -hex 32 > "$RUNNER_TEMP/bootstrap")
          # Readable by the containers' group (10001) only, as the install guide says.
          sudo install -d -m 0750 -g 10001 /etc/vectory
          cat "$RUNNER_TEMP/pki/server.pem" "$RUNNER_TEMP/pki/ca.pem" | sudo install -m 0440 -g 10001 /dev/stdin /etc/vectory/server.pem
          sudo install -m 0440 -g 10001 "$RUNNER_TEMP/pki/server-key.pem" /etc/vectory/server-key.pem
          sudo install -m 0440 -g 10001 "$RUNNER_TEMP/bootstrap" /etc/vectory/bootstrap
          cp .env.example .env
          sed -i -e 's#^VECTORY_HOSTNAME=.*#VECTORY_HOSTNAME=localhost#' \
            -e 's#^VECTORY_BIND_IP=.*#VECTORY_BIND_IP=127.0.0.1#' \
            -e 's#^VECTORY_TLS_CERT_FILE=.*#VECTORY_TLS_CERT_FILE=/etc/vectory/server.pem#' \
            -e 's#^VECTORY_TLS_KEY_FILE=.*#VECTORY_TLS_KEY_FILE=/etc/vectory/server-key.pem#' \
            -e 's#^VECTORY_BOOTSTRAP_SECRET_FILE=.*#VECTORY_BOOTSTRAP_SECRET_FILE=/etc/vectory/bootstrap#' .env
      - name: Check the resolved configuration isolates the validator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '
            .networks.validation.internal == true
            and (.services.validator.networks | keys) == ["validation"]
            and ((.services.validator.ports // []) | length) == 0
            and ((.services.validator.secrets // []) | length) == 0
            and ((.services.validator.volumes // []) | length) == 0
            and .services.validator.read_only == true
            and .services.validator.cap_drop == ["ALL"]
            and .services.validator.user == "10002:10002"
            and .services.server.depends_on.validator.condition == "service_healthy"
          ' "$RUNNER_TEMP/compose.json"
      # 30 minutes, not 10: a cold release build (thin LTO, one codegen unit,
      # SQLite at -O3) of the server, plus the agents, on a small runner.
      - name: Build the server and validator images
        timeout-minutes: 30
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        id: stack
        timeout-minutes: 10
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps
      - name: The instance answers through the TLS proxy and is not set up yet
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # A started container is not yet a listening proxy: retry a refused connection.
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --cacert "$RUNNER_TEMP/pki/ca.pem" https://localhost/api/v1/status | tee "$RUNNER_TEMP/status-before.json"
          echo
          jq -e '.initialized == false' "$RUNNER_TEMP/status-before.json"
      - name: Provide the pinned Vector 0.58.0 for the enrolled device
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz
          VECTOR_SHA256: a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | sha256sum -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/vector-x86_64-unknown-linux-gnu/bin/vector"
          [[ "$("$binary" --version)" == "vector 0.58.0 "* ]]
          echo "VECTORY_VECTOR_BIN=$binary" >> "$GITHUB_ENV"
      - name: Create the first administrator and enroll a device with the Add device installer
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: .
        env:
          VECTORY_URL: https://localhost
          VECTORY_CA_FILE: ${{ runner.temp }}/pki/ca.pem
          VECTORY_CREDENTIALS: ${{ runner.temp }}/credentials.json
          VECTORY_BOOTSTRAP_SECRET_FILE: ${{ runner.temp }}/bootstrap
        run: |
          node scripts/check-installer.mjs --output artifacts/compose
          curl -fsS --cacert "$VECTORY_CA_FILE" https://localhost/api/v1/status | jq -e '.initialized == true'
      - name: The validator cannot reach the internet
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # A failed probe proves nothing unless the probe itself runs.
          docker compose exec -T validator bash -c 'echo probe ready'
          if docker compose exec -T server timeout 10 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443'; then
            echo "Control: the server container, on the proxy network, reaches 1.1.1.1:443."
          else
            echo "::warning::The server container cannot reach 1.1.1.1:443 either, so only the internal network in the resolved configuration backs the result below."
          fi
          if docker compose exec -T validator timeout 10 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443'; then
            echo "::error::The validator opened a connection to 1.1.1.1:443."
            exit 1
          fi
          if docker compose exec -T validator timeout 10 getent hosts github.com; then
            echo "::error::The validator resolved a public name (github.com)."
            exit 1
          fi
          echo "PASS: the validator can neither connect to 1.1.1.1:443 nor resolve github.com."
      # The uploaded artifact holds the full logs; this puts the state and the
      # recent lines of each service where the failed run is read.
      - name: Show the services' state and recent logs after a failure
        if: ${{ failure() }}
        timeout-minutes: 10
        run: |
          set +e
          docker compose ps -a
          for service in proxy server validator; do
            echo "::group::$service (last 80 lines)"
            docker compose logs --no-color --tail 80 "$service"
            echo "::endgroup::"
          done
      - name: Collect the logs and remove the stack and its volumes
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          mkdir -p ../artifacts/compose
          docker compose ps -a > ../artifacts/compose/ps.txt 2>&1
          docker compose logs --no-color --timestamps > ../artifacts/compose/compose.log 2>&1
          docker compose down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: compose
          path: artifacts/compose
          if-no-files-found: warn
  # Browser harnesses that ran twice without failure on the reviewed tree; the
