name: platforms
# The product on every platform it claims, with real Vector 0.58.0 and a real
# server: the agent as a systemd service on Linux (the generated unit and the
# packaged strict one), as a launchd daemon on macOS and as a Windows service,
# and the dashboard in Firefox and WebKit. docs/internal/CI.md says what each
# job proves. It runs by hand (workflow_dispatch) and when this file or a script
# it runs changes, so it can be worked on without the whole `checks` workflow.
# Every phase of every job is one named step that writes an evidence file under
# artifacts/platforms, and the logs are uploaded even when a step fails.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/platforms.yml"
      - "tests/platform/**"
      - "tests/native-workflow.mjs"
      - "tests/protect-fixture.ps1"
      - "scripts/preview.sh"
      - "scripts/check-installer.mjs"
      - "packaging/Start-LocalPreview.ps1"
      - "packaging/systemd/vectory.service"
      - "packaging/dev-pki/main.go"
      - "packaging/build-release.py"
      - "dashboard/playwright.config.ts"
      - "dashboard/e2e/cross-browser.spec.ts"
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  # Real systemd on a GitHub-hosted VM. The agent is installed with
  # `vectory setup --create-user`, a pipeline is applied through the service,
  # the service is restarted, killed and stopped, and the packaged unit
  # (packaging/systemd/vectory.service, only ExecStart adjusted) takes over and
  # is read from inside its own mount namespace.
  linux-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VECTORY_PREVIEW_DIR: ${{ github.workspace }}/.local/preview
      VECTORY_PREVIEW_AGENT_TARGETS: linux/amd64
      VECTORY_PLATFORM_OUTPUT: artifacts/platforms/linux-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - name: Check the platform helpers against the text the tools print
        timeout-minutes: 10
        run: node --test tests/platform/lib.test.mjs
      - name: Build the dashboard the instance serves
        timeout-minutes: 20
        run: |
          (cd help-center && npm ci)
          (cd dashboard && npm ci && npm run build)
      - name: Build the server, the validator and vectory-admin
        timeout-minutes: 30
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bins
      - name: Provide the pinned Vector 0.58.0
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz
          VECTOR_SHA256: a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | sha256sum -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/vector-x86_64-unknown-linux-gnu/bin/vector"
          version="$("$binary" --version)"
          echo "$version"
          [[ "$version" == "vector 0.58.0 "* ]]
          echo "VECTORY_PREVIEW_VECTOR=$binary" >> "$GITHUB_ENV"
          echo "VECTORY_VECTOR_BIN=$binary" >> "$GITHUB_ENV"
      - name: Start a fresh instance with the real validator
        id: instance
        timeout-minutes: 10
        run: scripts/preview.sh start
      # setup creates the vectory account, registers /etc/systemd/system/vectory.service,
      # starts it and waits for the first check-in; then the manager, the journal
      # and the API are read.
      - name: Install the agent as a systemd service for an unprivileged account and enroll it
        id: install
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs install
      - name: Run the clean-install workflow against the service
        id: apply
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs apply generated
      # After the apply, which gives the agent a data directory to report. A failed
      # apply still gets its reading: the mount table is what explains it.
      - name: Read the generated unit's sandbox from the running service
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: node tests/platform/linux-sandbox.mjs generated
      - name: Restart the service, kill the agent and stop the service
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        timeout-minutes: 25
        run: node tests/platform/service.mjs lifecycle
      - name: Remove the service and keep its state
        id: uninstall
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs uninstall
      - name: Run the packaged strict unit and read its sandbox
        id: packaged
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/linux-sandbox.mjs packaged
      - name: Apply a pipeline under the strict unit
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs apply strict
      - name: Collect the service's logs and the instance's logs
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          node tests/platform/service.mjs collect
          mkdir -p "$VECTORY_PLATFORM_OUTPUT/logs"
          # What a failed run needs, in the log itself (the artifact holds the rest).
          echo "::group::The service's journal"
          sudo journalctl -u vectory --no-pager -n 150
          echo "::endgroup::"
          echo "::group::The folders the service writes"
          sudo ls -la /etc/vectory /etc/vectory/managed /var/lib/vectory-agent /var/lib/vector
          echo "::endgroup::"
          scripts/preview.sh stop
          cp "$VECTORY_PREVIEW_DIR"/server.log "$VECTORY_PREVIEW_DIR"/validator.log "$VECTORY_PLATFORM_OUTPUT/logs/"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: platforms-linux-service
          path: artifacts/platforms/linux-service
          if-no-files-found: warn
  # The server and the validator are built and run natively on Windows with
  # packaging/Start-LocalPreview.ps1. The agent runs in the foreground first
  # (tests/native-workflow.mjs), then as the Vectory service under
  # NT SERVICE\Vectory. The Windows preview script starts no validator and
  # serves the leaf certificate only; this job starts the validator and appends
  # the CA to the served chain, as scripts/preview.sh does.
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      VECTORY_PLATFORM_OUTPUT: artifacts/platforms/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 10
        with: { python-version: "3.13" }
      - name: Check the platform helpers against the text the tools print
        timeout-minutes: 10
        run: node --test tests/platform/lib.test.mjs
      - name: Build the dashboard the instance serves
        timeout-minutes: 20
        run: |
          Push-Location help-center
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location dashboard
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Build the server, the validator and vectory-admin
        timeout-minutes: 45
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bins
          exit $LASTEXITCODE
      - name: Create the development PKI and let the agent listener present its chain
        timeout-minutes: 10
        run: |
          go run packaging/dev-pki/main.go --out .local/pki --hosts localhost,127.0.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Setup pins the CA by fingerprint, which needs the CA in the chain the listener sends.
          $pki = Join-Path $PWD '.local/pki'
          [IO.File]::AppendAllText((Join-Path $pki 'server.pem'), [IO.File]::ReadAllText((Join-Path $pki 'ca.pem')))
      - name: Build the Windows agent release the instance lists
        timeout-minutes: 15
        run: |
          python packaging/build-release.py --target windows/amd64 --out artifacts/releases
          exit $LASTEXITCODE
      - name: Provide the pinned Vector 0.58.0
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-x86_64-pc-windows-msvc.zip
          VECTOR_SHA256: 72bbedf4772302f7f67e7db2120fe5b42e39ae65873c895876fc2038050c10c5
          VECTOR_BINARY: bin/vector.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP $env:VECTOR_ARCHIVE
          Invoke-WebRequest -Uri "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$env:VECTOR_ARCHIVE" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:VECTOR_SHA256) { throw "Checksum mismatch for $($env:VECTOR_ARCHIVE): expected $($env:VECTOR_SHA256), got $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'vector'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = (Get-Item -LiteralPath (Join-Path $destination $env:VECTOR_BINARY)).FullName
          $version = & $binary --version
          Write-Output $version
          if ($LASTEXITCODE -ne 0 -or -not "$version".StartsWith('vector 0.58.0 ')) { throw "Unexpected Vector build at ${binary}: $version" }
          "VECTORY_VECTOR_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Start the validator with the pinned Vector
        timeout-minutes: 5
        env:
          VECTORY_VALIDATOR_ISOLATED: "true"
          VECTORY_VALIDATOR_ADDR: 127.0.0.1:8081
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VECTORY_VECTOR_BINARY = $env:VECTORY_VECTOR_BIN
          $preview = Join-Path $PWD '.local/preview'
          New-Item -ItemType Directory -Force $preview | Out-Null
          $process = Start-Process -FilePath (Join-Path $PWD 'server/target/debug/vector-validator.exe') -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $preview 'validator.log') -RedirectStandardError (Join-Path $preview 'validator-error.log')
          [IO.File]::WriteAllText((Join-Path $preview 'validator.pid'), [string]$process.Id)
          $ready = $false
          foreach ($attempt in 1..60) {
            try {
              $client = New-Object Net.Sockets.TcpClient
              $client.Connect('127.0.0.1', 8081)
              $client.Close()
              $ready = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) {
            Get-Content (Join-Path $preview 'validator.log'), (Join-Path $preview 'validator-error.log') -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw 'The validator did not listen on 127.0.0.1:8081.'
          }
          'VECTORY_VALIDATION_URL=http://127.0.0.1:8081' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Start a fresh instance with Start-LocalPreview.ps1
        id: instance
        timeout-minutes: 10
        run: |
          pwsh -NoProfile -File packaging/Start-LocalPreview.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The script returns once the server process starts: wait until it answers.
          $status = $null
          $deadline = (Get-Date).AddMinutes(2)
          while (-not $status -and (Get-Date) -lt $deadline) {
            try { $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/v1/status' -TimeoutSec 5 } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $status) {
            Get-Content .local/preview/server.log, .local/preview/server-error.log -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw 'The server did not answer within two minutes.'
          }
          $status | ConvertTo-Json -Compress
      - name: Run the clean-install workflow with the downloaded agent
        id: native
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VECTORY_NATIVE_WORKFLOW_OUTPUT: artifacts/platforms/windows/native-foreground
        run: node tests/native-workflow.mjs
      - name: Stop the foreground agent the workflow leaves running
        id: foreground
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 10
        run: node tests/platform/service.mjs stop-foreground
      - name: Install the agent as the Vectory service and enroll it
        id: install
        if: ${{ !cancelled() && steps.foreground.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs install
      - name: Run the clean-install workflow against the service
        id: apply
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs apply service
      - name: Restart the service, kill the agent and stop the service
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        timeout-minutes: 25
        run: node tests/platform/service.mjs lifecycle
      - name: Remove the service and keep its state
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs uninstall
      - name: Collect the service's logs, the instance's logs and stop the instance
        if: always()
        timeout-minutes: 10
        run: |
          node tests/platform/service.mjs collect
          $logs = Join-Path $PWD 'artifacts/platforms/windows/logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          Copy-Item '.local/preview/*.log' $logs -ErrorAction SilentlyContinue
          # The foreground agent's logs only: its state folder holds its private key.
          foreach ($folder in Get-ChildItem '.local' -Directory -Filter 'native workflow *') {
            foreach ($name in 'agent.log', 'agent-error.log') {
              $file = Join-Path $folder.FullName $name
              if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file (Join-Path $logs "$($folder.Name) $name") }
            }
            Get-ChildItem -LiteralPath (Join-Path $folder.FullName 'state') -Filter 'vector.log*' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item -LiteralPath $_.FullName (Join-Path $logs "$($folder.Name) $($_.Name)") }
          }
          # What a failed run needs, in the log itself (the artifact holds the rest).
          foreach ($name in 'validator.log', 'validator-error.log', 'server.log', 'server-error.log') {
            $file = Join-Path $PWD ".local/preview/$name"
            if (Test-Path -LiteralPath $file) {
              Write-Host "::group::$name"
              Get-Content -LiteralPath $file -Tail 40
              Write-Host '::endgroup::'
            }
          }
          Write-Host '::group::The service, if it is still registered'
          sc.exe query Vectory
          Write-Host '::endgroup::'
          foreach ($name in 'server.pid', 'validator.pid') {
            $file = Join-Path $PWD ".local/preview/$name"
            if (Test-Path -LiteralPath $file) { Stop-Process -Id ([int](Get-Content -LiteralPath $file)) -Force -ErrorAction SilentlyContinue }
          }
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: platforms-windows
          path: artifacts/platforms/windows
          if-no-files-found: warn
  # macOS 15 on Apple silicon: scripts/preview.sh under the system bash (3.2
  # and BSD tools), the agent in the foreground, then as the io.vectory.agent
  # launch daemon under the _vectory account.
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VECTORY_PREVIEW_DIR: ${{ github.workspace }}/.local/preview
      VECTORY_PREVIEW_AGENT_TARGETS: darwin/arm64
      VECTORY_PLATFORM_OUTPUT: artifacts/platforms/macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - name: Check the platform helpers against the text the tools print
        timeout-minutes: 10
        run: node --test tests/platform/lib.test.mjs
      - name: Build the dashboard the instance serves
        timeout-minutes: 20
        run: |
          (cd help-center && npm ci)
          (cd dashboard && npm ci && npm run build)
      - name: Build the server, the validator and vectory-admin
        timeout-minutes: 40
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bins
      - name: Provide the pinned Vector 0.58.0
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-arm64-apple-darwin.tar.gz
          VECTOR_SHA256: 9182491597f1bdedb08d84a051616c62deea770a9d905b697712cc6526919449
          VECTOR_BINARY: vector-arm64-apple-darwin/bin/vector
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | shasum -a 256 -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/$VECTOR_BINARY"
          version="$("$binary" --version)"
          echo "$version"
          [[ "$version" == "vector 0.58.0 "* ]]
          echo "VECTORY_PREVIEW_VECTOR=$binary" >> "$GITHUB_ENV"
          echo "VECTORY_VECTOR_BIN=$binary" >> "$GITHUB_ENV"
      - name: Start a fresh instance with the system bash
        id: instance
        timeout-minutes: 15
        run: |
          /bin/bash --version | head -n 1
          /bin/bash scripts/preview.sh start
      - name: Run the clean-install workflow with the downloaded agent
        id: native
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VECTORY_NATIVE_WORKFLOW_OUTPUT: artifacts/platforms/macos/native-foreground
        run: node tests/native-workflow.mjs
      - name: Install and enroll a second device with the Add device installer
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VECTORY_URL: http://127.0.0.1:8080
          VECTORY_CA_FILE: ${{ github.workspace }}/.local/pki/ca.pem
          VECTORY_CREDENTIALS: ${{ github.workspace }}/.local/preview/credentials.json
          VECTORY_BOOTSTRAP_SECRET_FILE: ${{ github.workspace }}/.local/preview/bootstrap.secret
          # The agent refuses paths through symbolic links, and macOS's default temporary folder is behind one.
          TMPDIR: ${{ runner.temp }}
        run: node scripts/check-installer.mjs --output artifacts/platforms/macos/installer
      - name: Stop the foreground agent the workflow leaves running
        id: foreground
        if: ${{ !cancelled() && steps.instance.outcome == 'success' }}
        timeout-minutes: 10
        run: node tests/platform/service.mjs stop-foreground
      - name: Install the agent as a launchd daemon for an unprivileged account and enroll it
        id: install
        if: ${{ !cancelled() && steps.foreground.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs install
      - name: Run the clean-install workflow against the daemon
        id: apply
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs apply service
      - name: Restart the daemon, kill the agent and stop the daemon
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        timeout-minutes: 25
        run: node tests/platform/service.mjs lifecycle
      - name: Remove the daemon and keep its state
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: node tests/platform/service.mjs uninstall
      - name: Collect the daemon's logs and the instance's logs
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          node tests/platform/service.mjs collect
          mkdir -p "$VECTORY_PLATFORM_OUTPUT/logs"
          /bin/bash scripts/preview.sh stop
          cp "$VECTORY_PREVIEW_DIR"/server.log "$VECTORY_PREVIEW_DIR"/validator.log "$VECTORY_PLATFORM_OUTPUT/logs/"
          # The foreground agent's logs only: its state folder holds its private key.
          for dir in "$GITHUB_WORKSPACE"/.local/native\ workflow\ */; do
            name="$(basename "$dir")"
            for file in agent.log agent-error.log; do cp "$dir$file" "$VECTORY_PLATFORM_OUTPUT/logs/$name $file"; done
            for file in "$dir"state/vector.log*; do cp "$file" "$VECTORY_PLATFORM_OUTPUT/logs/$name $(basename "$file")"; done
          done
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: platforms-macos
          path: artifacts/platforms/macos
          if-no-files-found: warn
  # The first things a person does on a new instance (sign-in, the first
  # administrator, create and publish a pipeline, the Devices page), in the
  # Firefox and WebKit builds Playwright installs. Each browser gets its own
  # fresh instance, because the first administrator can be created only once.
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VECTORY_PREVIEW_AGENT_TARGETS: linux/amd64
      VECTORY_UI_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 10
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            help-center/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 10
        with: { go-version: "1.26.8", cache-dependency-path: agent/go.sum }
      - name: Build the dashboard the instance serves
        id: dashboard
        timeout-minutes: 20
        run: |
          (cd help-center && npm ci)
          (cd dashboard && npm ci && npm run build)
      - name: Build the server, the validator and vectory-admin
        timeout-minutes: 30
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --locked --manifest-path server/Cargo.toml --bins
      - name: Provide the pinned Vector 0.58.0
        timeout-minutes: 10
        env:
          VECTOR_ARCHIVE: vector-0.58.0-x86_64-unknown-linux-gnu.tar.gz
          VECTOR_SHA256: a4634bea859a7ad7064ff3dd6f6ad7eb0e8dd4493cc41657d84da8dd66f09d09
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$VECTOR_ARCHIVE" "https://github.com/vectordotdev/vector/releases/download/v0.58.0/$VECTOR_ARCHIVE"
          echo "$VECTOR_SHA256  $VECTOR_ARCHIVE" | sha256sum -c -
          mkdir vector
          tar -xzf "$VECTOR_ARCHIVE" -C vector
          binary="$RUNNER_TEMP/vector/vector-x86_64-unknown-linux-gnu/bin/vector"
          version="$("$binary" --version)"
          echo "$version"
          [[ "$version" == "vector 0.58.0 "* ]]
          echo "VECTORY_PREVIEW_VECTOR=$binary" >> "$GITHUB_ENV"
      - name: Install Firefox and WebKit with their system libraries
        id: install
        timeout-minutes: 15
        working-directory: dashboard
        run: npx playwright install --with-deps firefox webkit
      - name: Firefox, on a fresh instance
        id: firefox
        if: ${{ !cancelled() && steps.dashboard.outcome == 'success' && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VECTORY_PREVIEW_DIR: ${{ github.workspace }}/.local/preview-firefox
          VECTORY_BOOTSTRAP_SECRET_FILE: ${{ github.workspace }}/.local/preview-firefox/bootstrap.secret
          VECTORY_E2E_BROWSERS: firefox
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/artifacts/platforms/browsers/firefox.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/platforms/browsers
          scripts/preview.sh start
          trap '"$GITHUB_WORKSPACE/scripts/preview.sh" stop; for log in server validator; do cp "$VECTORY_PREVIEW_DIR/$log.log" "$GITHUB_WORKSPACE/artifacts/platforms/browsers/firefox-$log.log" 2>/dev/null || true; done' EXIT
          cd dashboard
          npx playwright test --reporter=list,json
      - name: WebKit, on a fresh instance
        id: webkit
        if: ${{ !cancelled() && steps.dashboard.outcome == 'success' && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VECTORY_PREVIEW_DIR: ${{ github.workspace }}/.local/preview-webkit
          VECTORY_BOOTSTRAP_SECRET_FILE: ${{ github.workspace }}/.local/preview-webkit/bootstrap.secret
          VECTORY_E2E_BROWSERS: webkit
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/artifacts/platforms/browsers/webkit.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/platforms/browsers
          scripts/preview.sh start
          trap '"$GITHUB_WORKSPACE/scripts/preview.sh" stop; for log in server validator; do cp "$VECTORY_PREVIEW_DIR/$log.log" "$GITHUB_WORKSPACE/artifacts/platforms/browsers/webkit-$log.log" 2>/dev/null || true; done' EXIT
          cd dashboard
          npx playwright test --reporter=list,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: platforms-browsers
          path: |
            artifacts/platforms/browsers
            dashboard/test-results
          if-no-files-found: warn
