[package]
name = "vectory-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
default-run = "vectory-server"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# IANA time zones for notification quiet hours; the data is compiled in, so
# no host tzdata is needed.
chrono-tz = "0.10.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# SMTP for email notifications, over the same rustls and ring as the rest of
# the server. No native TLS, no connection pool, no hostname lookup.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
time = "0.3.47"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
