name: vectory
services:
  certificates:
    image: ${VECTORY_SERVER_IMAGE:?Run ./start.sh first}
    pull_policy: never
    entrypoint: [/app/operations/vectory-server-pki]
    command: [--out, /run/secrets, --hostname, "${VECTORY_HOSTNAME:?Set your DNS name}", --watch]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16
    environment: { GOMAXPROCS: '2', GOMEMLIMIT: 48MiB }
    volumes: [secrets:/run/secrets]
    healthcheck:
      test: [CMD, /app/operations/vectory-local-pki, --server-cert, /run/secrets/server_cert, --server-key, /run/secrets/server_key, --hostname, "${VECTORY_HOSTNAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
  server:
    image: ${VECTORY_SERVER_IMAGE:?Run ./start.sh first}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      # The TLS certificate file should hold the full chain (server, then CA):
      # devices pin the CA that the agent listener presents.
      VECTORY_TLS_CERT: /run/secrets/server_cert
      VECTORY_TLS_KEY: /run/secrets/server_key
      VECTORY_BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap
      VECTORY_VALIDATION_URL: http://validator:8081
      # Addresses people and devices use: the dashboard through the proxy on
      # 443 and the agent listener published on 8443.
      VECTORY_PUBLIC_URL: https://${VECTORY_HOSTNAME:?Set the DNS name in deploy/.env}
      VECTORY_PUBLIC_AGENT_URL: https://${VECTORY_HOSTNAME:?Set the DNS name in deploy/.env}:8443
      # The HTTP listener is reachable only through the proxy below, which
      # sets X-Forwarded-For to the client address.
      VECTORY_TRUST_PROXY_HEADERS: "true"
      # The listener enforces that itself: it closes a connection from anything
      # but the proxy (and its own loopback, for the health check). The
      # validator shares a network with the server and runs untrusted pipeline
      # code, so it must not reach this port.
      VECTORY_HTTP_ALLOWED_PEERS: proxy
      # Agents are bundled in the image (/app/agent-releases). An optional
      # operator mirror mounted at /app/releases replaces a platform's build.
      VECTORY_RELEASES_DIR: /app/releases
      # Set to false to stop serving the installer and agents to devices.
      VECTORY_PUBLIC_AGENT_DOWNLOADS: ${VECTORY_PUBLIC_AGENT_DOWNLOADS:-true}
      VECTORY_MAX_AGENT_CONNECTIONS: ${VECTORY_MAX_AGENT_CONNECTIONS:-16384}
      VECTORY_TELEMETRY_RETENTION_DAYS: ${VECTORY_TELEMETRY_RETENTION_DAYS:-7}

    volumes:
      - data:/var/lib/vectory
      - secrets:/run/secrets:ro
      - ${VECTORY_RELEASES_DIRECTORY:-./releases}:/app/releases:ro
    ports:
      - "${VECTORY_BIND_IP:-0.0.0.0}:8443:8443"
    networks: [private, validation]
    depends_on:
      certificates:
        condition: service_healthy
      validator:
        condition: service_healthy
  validator:
    image: ${VECTORY_VALIDATOR_IMAGE:?Run ./start.sh first}
    pull_policy: never
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10002,gid=10002"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    environment:
      VECTORY_VALIDATOR_ISOLATED: "true"
    # GET /health answers only after the validator has confirmed the pinned
    # Vector. The image has no HTTP client, so bash asks over /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"ok"' <&3
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [validation]
  proxy:
    image: ${VECTORY_PROXY_IMAGE:-caddy:2.11.7-alpine@sha256:d76116d819d5162f464b0f2cd09bd28c568a86148c7bc539ce17c33eb22d8bbb}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    # The image's caddy binary carries the file capability NET_BIND_SERVICE, and
    # the kernel refuses to run a binary whose file capabilities are not in the
    # container's bounding set ("exec /usr/bin/caddy: operation not permitted",
    # then a restart loop). Keep exactly that one. Caddy listens on 8443 here,
    # so it never binds a low port.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      VECTORY_HOSTNAME: ${VECTORY_HOSTNAME:?Set the DNS name in deploy/.env}
    volumes: [./Caddyfile.auto:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]

    extra_hosts: ["${VECTORY_HOSTNAME:?Set your DNS name}:127.0.0.1"]
    ports:
      - "${VECTORY_BIND_IP:-0.0.0.0}:80:8080"
      - "${VECTORY_BIND_IP:-0.0.0.0}:443:8443"
    # Healthy only once a request through the proxy reaches the server, so
    # `docker compose up --wait` doesn't report a proxy that started but isn't
    # serving. The intended DNS name resolves to loopback inside this proxy
    # so TLS sends the correct SNI. This liveness probe deliberately skips
    # issuer verification; separate release probes verify the real trust chain.
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null --no-check-certificate https://$$VECTORY_HOSTNAME:8443/api/v1/status'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      server:
        condition: service_healthy
    networks: [private]
volumes:
  data:
  caddy_data:
    external: true
    name: ${VECTORY_SERVER_PROJECT:-vectory}_caddy_data
  caddy_config:
    external: true
    name: ${VECTORY_SERVER_PROJECT:-vectory}_caddy_config
  secrets:
    external: true
    name: ${VECTORY_SERVER_PROJECT:-vectory}_secrets
networks:
  private:
  validation:
    internal: true
